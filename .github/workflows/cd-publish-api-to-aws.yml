name: CD - Publish API to AWS ECR

# Dieser Workflow wird NUR manuell über die Actions-UI ausgelöst.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git Branch oder Commit-SHA, der veröffentlicht werden soll'
        required: true
        default: 'master'


permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: carconfig-api
  DOCKER_CONTEXT: .
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  publish:
    name: Build and Push API to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout specific commit/branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          role-session-name: GitHubActionsECRPublish

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}