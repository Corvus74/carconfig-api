name: CI - Validate API

# Dieser Workflow wird automatisch bei Pull Requests auf den main-Branch ausgeführt.
on:
  schedule:
    - cron: '30 8 * * *'
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # =====================================================
  # Schritt 1: Anwendung bauen (kompilieren & JAR erstellen)
  # =====================================================
  build:
    name: 1. Build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Make Gradle Executeable
        run: chmod +x ./gradlew

      - name: Build with Gradle (create JAR, skip tests)
        run: ./gradlew --no-daemon bootJar -x test
  # =====================================================
  # Schritt 2: Tests ausführen (abhängig von Schritt 1)
  # =====================================================
  test:
    name: 2. Test API
    needs: build # Läuft nur, wenn Job 'build' erfolgreich war
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Make Gradle Executeable
        run: chmod +x ./gradlew

      - name: Run tests with Gradle
        run: ./gradlew --no-daemon test

  # =====================================================
  # Schritt 3: Docker-Build validieren (abhängig von Schritt 2)
  # =====================================================
  validate_docker_build:
    name: 3. Validate API Docker Build
    needs: test # Läuft nur, wenn Job 'test' erfolgreich war
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (without pushing)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # Wichtig: Nur bauen, nicht veröffentlichen
          tags: local-validation/carconfig-api:latest