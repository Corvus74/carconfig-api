# GitLab CI/CD pipeline for building, testing, and pushing Docker image to AWS ECR
# Requirements (set these CI/CD variables in your GitLab project/group):
# - AWS_ACCESS_KEY_ID:      AWS access key id with permissions for ECR (ecr:*), STS, etc.
# - AWS_SECRET_ACCESS_KEY:  AWS secret access key
# - AWS_DEFAULT_REGION:     e.g. eu-central-1
# - ECR_ACCOUNT_ID:         e.g. 123456789012 (used to build ECR_REGISTRY if not given)
# - ECR_REPOSITORY:         e.g. carconfig-api (ECR repo name)
# Optional overrides:
# - ECR_REGISTRY:           e.g. 123456789012.dkr.ecr.eu-central-1.amazonaws.com
# - DOCKER_BUILD_ARGS:      additional build args, e.g. "--build-arg SKIP_TESTS=true"
#
# The pipeline:
# 1) test: run Gradle tests
# 2) build_push: build Docker image (Java 24 runtime), login to ECR, and push tags

stages:
  - test
  - build_push

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Docker in Docker settings
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Cache Gradle directories between pipeline runs to speed up builds
cache:
  key: "$CI_PROJECT_NAME-gradle"
  paths:
    - .gradle/wrapper
    - .gradle/caches

# 1) Run unit tests with Gradle
unit_test:
  stage: test
  image: gradle:8.7.0-jdk17
  script:
    - gradle --version
    - ./gradlew --no-daemon clean test
  artifacts:
    when: always
    paths:
      - build/reports/tests/
    expire_in: 1 week

# 2) Build Docker image and push to AWS ECR
build_and_push_image:
  stage: build_push
  image: docker:25.0.3-cli
  services:
    - name: docker:25.0.3-dind
      alias: docker
  variables:
    # Docker client will talk to the DinD service
    DOCKER_HOST: tcp://docker:2376
  needs:
    - job: unit_test
      artifacts: false
  before_script:
    - apk add --no-cache aws-cli bash git
    # Resolve ECR registry if not provided
    - |
      if [ -z "${ECR_REGISTRY}" ] && [ -n "${ECR_ACCOUNT_ID}" ] && [ -n "${AWS_DEFAULT_REGION}" ]; then
        export ECR_REGISTRY="${ECR_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      fi
      echo "Using ECR_REGISTRY=${ECR_REGISTRY}"
      echo "Using ECR_REPOSITORY=${ECR_REPOSITORY}"
    # Authenticate Docker to AWS ECR
    - aws --version
    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
        | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    # Ensure repository exists
    - |
      aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_DEFAULT_REGION" \
        || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_DEFAULT_REGION"
  script:
    - export IMAGE_NAME="${ECR_REGISTRY}/${ECR_REPOSITORY}"
    - echo "Building image ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker build ${DOCKER_BUILD_ARGS} -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" -t "${IMAGE_NAME}:latest" .
    - docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_NAME}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
