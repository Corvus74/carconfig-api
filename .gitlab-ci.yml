# GitLab CI/CD pipeline for validating the carconfig-api application.
# This pipeline mirrors the 3-step logic from the GitHub Actions CI workflow.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build
  - test
  - validate_docker

# Cache Gradle directories between pipeline runs to speed up builds
cache:
  key:
    files:
      - build.gradle.kts
      - settings.gradle.kts
  paths:
    - .gradle/wrapper
    - .gradle/caches

# =====================================================
# Step 1: Build the application JAR
# =====================================================
build_app:
  stage: build
  # Use a JDK 24 image to match the Dockerfile build environment
  image: gradle:8.14-jdk24
  script:
    - echo "Making gradlew executable..."
    - chmod +x ./gradlew
    - echo "Building the application JAR, skipping tests..."
    - ./gradlew --no-daemon bootJar -x test

# =====================================================
# Step 2: Run tests
# =====================================================
test_app:
  stage: test
  image: gradle:8.14-jdk24
  needs:
    - build_app # Ensure this runs only after a successful build
  script:
    - echo "Making gradlew executable..."
    - chmod +x ./gradlew
    - echo "Running tests..."
    - ./gradlew --no-daemon test
  artifacts: # Save test reports for review
    when: always
    paths:
      - build/reports/tests/
    expire_in: 1 week

# =====================================================
# Step 3: Validate the Docker build
# =====================================================
validate_docker_build:
  stage: validate_docker
  image: docker:26.1-cli # Use a Docker CLI image
  services:
    - docker:26.1-dind # Enable Docker-in-Docker
  needs:
    - test_app # Ensure this runs only after successful tests
  script:
    - echo "Validating the Docker build process..."
    - docker build -t local-validation/carconfig-api:latest .
