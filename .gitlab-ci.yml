# GitLab CI/CD pipeline for building, testing, and pushing a Docker image to AWS ECR.
# This pipeline uses OIDC for secure authentication with AWS.

# --- CI/CD Variable Requirements ---
# Set these in your GitLab Project/Group settings under "CI/CD" -> "Variables":
# - AWS_REGION:         The AWS region of your ECR repository (e.g., us-east-1).
# - AWS_ROLE_ARN:       The ARN of the IAM Role that GitLab will assume.
# - ECR_REGISTRY_URL:   The full URL of your ECR registry (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com).

stages:
  - test
  - build-and-push

variables:
  # Define variables for consistency
  ECR_REPOSITORY: "carconfig-api"
  DOCKER_CONTEXT_PATH: "carconfig-api" # Path to the backend application

# Cache Gradle directories between pipeline runs to speed up builds
cache:
  key:
    files:
      - $DOCKER_CONTEXT_PATH/build.gradle.kts
      - $DOCKER_CONTEXT_PATH/settings.gradle.kts
  paths:
    - $DOCKER_CONTEXT_PATH/.gradle/wrapper
    - $DOCKER_CONTEXT_PATH/.gradle/caches

# ========================================
# Job 1: Run Unit and Integration Tests
# ========================================
test:
  stage: test
  # Use a JDK 24 image to match the Dockerfile build environment
  image: gradle:8.8-jdk24
  # Execute scripts from within the application's directory
  working_dir: $DOCKER_CONTEXT_PATH
  script:
    - echo "Running tests with Gradle..."
    - ./gradlew --no-daemon clean test
  artifacts:
    when: always
    paths:
      - $DOCKER_CONTEXT_PATH/build/reports/tests/
    expire_in: 1 week

# =====================================================
# Job 2: Build and Push Docker image (if tests pass)
# =====================================================
build-and-push:
  stage: build-and-push
  # Use an image that includes both Docker and AWS CLI tools
  image:
    name: amazon/aws-cli:2.15.26
    entrypoint: [""]
  services:
    # Enable Docker-in-Docker to build images
    - docker:26.1-dind
  needs:
    # This job depends on the 'test' job completing successfully
    - job: test
  # Request a JWT from GitLab for OIDC authentication
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - echo "Authenticating with AWS using OIDC..."
    # Exchange the GitLab OIDC token for temporary AWS credentials
    - |
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
      $(aws sts assume-role-with-web-identity \
      --role-arn "${AWS_ROLE_ARN}" \
      --role-session-name "GitLabRunner-${CI_PIPELINE_ID}" \
      --web-identity-token "${GITLAB_OIDC_TOKEN}" \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text))
    - echo "Logging in to Amazon ECR..."
    - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY_URL}
  script:
    - echo "Building and tagging the Docker image..."
    - IMAGE_TAG_SHA="${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    - IMAGE_TAG_LATEST="${ECR_REGISTRY_URL}/${ECR_REPOSITORY}:latest"
    - docker build -t "${IMAGE_TAG_SHA}" -t "${IMAGE_TAG_LATEST}" "${DOCKER_CONTEXT_PATH}"
    - echo "Pushing image to ECR..."
    - docker push --all-tags "${ECR_REGISTRY_URL}/${ECR_REPOSITORY}"
    - echo "Push complete."
  # This job will only run on pushes to the 'main' branch
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - |
