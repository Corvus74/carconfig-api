spring:
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    username: "sa"
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: "create-drop"
    database-platform: "org.hibernate.dialect.H2Dialect"
    properties:
      jakarta:
        persistence:
          validation:
            mode: none
cors:
  allowed-origins: "http://localhost:3000,http://localhost:4200"

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE